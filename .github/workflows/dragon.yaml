name: Generate ASCII Artwork Dragon

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate-artwork:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install cowsay
        run: sudo apt-get update && sudo apt-get install -y cowsay

      - name: Generate artwork.txt
        run: |
          cowsay -f dragon "Hello from GitHub Actions!" > artwork.txt

      - name: Show artwork
        run: cat artwork.txt

      
