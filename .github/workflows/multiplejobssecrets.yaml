name: Multiple Jobs Environment Variables Demo

# 1. WORKFLOW LEVEL (Global Scope)
# Accessible across all jobs and all steps in this workflow file.
env:
  GLOBAL_VAR: "I am available everywhere Master"
  OVERRIDE_ME: "Original global value Master"

on:
  push:
    branches: [ main ]
  workflow_dispatch: # Allows manual triggering from the GitHub Actions UI

jobs:
  job_one:
    runs-on: ubuntu-latest

    # 2. JOB LEVEL Scope
    # Accessible only within the steps of this specific job.
    env:
      JOB_VAR: "I am available only in job_one Mango"
      OVERRIDE_ME: "Job level overrides workflow level Mango"

    steps:
      - name: Display variables in Job 1
        # 3. STEP LEVEL Scope
        # Accessible ONLY within this single step.
        env:
          STEP_VAR: "I am available only in step 1 Jackfruit"
          OVERRIDE_ME: "Step level overrides job level Jackfruit"
        run: |
          echo "=== Accessing via Shell Syntax ($) ==="
          echo "Global: $GLOBAL_VAR"
          echo "Job: $JOB_VAR"
          echo "Step: $STEP_VAR"
          echo "Override Priority Test: $OVERRIDE_ME"
          
          echo "=== Accessing via GitHub Context Syntax (${{ env.KEY }}) ==="
          echo "Context Global: ${{ env.GLOBAL_VAR }}"
          echo "Context Override: ${{ env.OVERRIDE_ME }}"

      - name: Demonstrate Step Isolation
        run: |
          echo "=== Step Isolation Check ==="
          echo "Global is still here: $GLOBAL_VAR"
          echo "Job is still here: $JOB_VAR"
          echo "Step 1 variable is gone/empty: '$STEP_VAR'"
          echo "Override falls back to Job level: $OVERRIDE_ME"

  job_two:
    runs-on: ubuntu-latest
    # This job does not have job-level env variables defined
    steps:
      - name: Display variables in Job 2
        run: |
          echo "=== Job Isolation Check ==="
          echo "Global is still here: $GLOBAL_VAR"
          echo "Job 1 variable is completely inaccessible here: '$JOB_VAR'"
          echo "Override falls back to global level: $OVERRIDE_ME"
